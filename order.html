<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Online - Coffee Haven</title>
    <link rel="stylesheet" href="css/style.css">
    

</head>
<body>

<header>
    <!-- Navbar (Consistent with all pages) -->
    <nav class="navbar">
        <div class="logo">☕ Bloom & Bean</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="specials.html">Specials</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="menu-btn"><i class="fas fa-bars"></i></div>
    </nav>
</header>

<main>
    <!-- Order Section -->
    <section class="order section-padding">
        <h2>📝 Place Your Order</h2>
        
        <form class="order-form">

            <h3>Your Details</h3>
            <input type="text" placeholder="Full Name" required>
            <input type="tel" placeholder="Phone Number" required>

            <h3>Select Your Item</h3>
            <select required>
                <option value="">-- Choose an item --</option>
                <option>Espresso - R35</option>
                <option>Americano - R38</option>
                <option>Cappuccino - R45</option>
                <option>Latte - R48</option>
                <option>Mocha - R52</option>
                <option>Cheesecake - R40</option>
                <option>Cookies - R15</option>
                <option>Muffin - R25</option>
                <option>Chocolatecake - R35</option>
                <option>Croissant - R28</option>
                
            <h3>Quantity</h3>
            <input type="number" min="1" value="1" required>

            <h3>Pickup or Delivery</h3>
            <select id="deliveryOption" required>
                <option value="">-- Select --</option>
                <option value="pickup">Pickup</option>
                <option value="delivery">Delivery</option>
            </select>

            <div id="addressField" style="display: none;">
                <h3>Delivery Address</h3>
                <textarea rows="4" placeholder="Full address for delivery..."></textarea>
            </div>

            <h3>Extra Notes</h3>
            <textarea rows="4" placeholder="Any special instructions... (e.g. extra sugar, no foam, etc.)"></textarea>

            <button type="submit" class="btn">Place Order</button>
        </form>
    </section>
</main>
    <!-- Footer -->
    <footer>
        <p>&copy; Copyrights Bloom & Bean</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>

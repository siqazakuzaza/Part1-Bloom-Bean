<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Coffee Haven</title>
    <link rel="stylesheet" href="css/style.css">
   

</head>
<body>

<header>
    <!-- Navbar (Consistent with all pages) -->
    <nav class="navbar">
        <div class="logo">☕ Bloom & Bean</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="specials.html">Specials</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="menu-btn"><i class="fas fa-bars"></i></div>
    </nav>
</header>

<main>
    <!-- Contact Section -->
    <section class="contact section-padding">
        <h2>Get In Touch</h2>
        <img src="images/telephone.jpg" alt="Contact" width="300px">
        
        <div class="contact-container">
            <!-- Contact Info -->
            <div class="contact-info">
                <h3>Contact Information</h3>
                <p><strong>Phone:</strong> 012 345 6789</p>
                <p><strong>Email:</strong> bloomandbean@gmail.com</p>
                <p><strong>Location:</strong> Benoni, Gauteng</p>
                
                
            </div>

            <!-- Contact Form -->
            <div class="contact-form-container">
                <h3>Send a Message</h3>
                <form class="contact-form">
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>
                    <textarea placeholder="Your Message..." rows="6" required></textarea>
                    <button type="submit" class="btn">Send Message</button>
                    <p id="formMessage"></p>
                </form>
            </div>
        </div>
    </section>
</main>

    <!-- Footer -->
    <footer>
        <p>&copy; Copyrights Bloom & Bean</p>
    </footer>

    <script src="js/script.js"></script>
</body>
